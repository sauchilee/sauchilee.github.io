<text x='20' y='26' font-size='17' font-weight='700' fill='#0b0b0b'>「與父同質」貫穿全本聖經 Of one being with the Father: the LORD of Israel and Jesus</text>
<text x='20' y='47' font-size='12' fill='#52514e'>左：舊約論耶和華（YHWH）的話；右：新約把同樣的話用在耶穌身上（各按聖經次序）。經文出自和合本，由工具核對。</text>
