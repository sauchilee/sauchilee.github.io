<text x='32' y='96' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>創 3:15</tspan>  「女人的後裔要傷你的頭」</text>
<rect x='20' y='114' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='114' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='134' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>創 22:8</tspan>  「神必自己預備作燔祭的羊羔」</text>
<rect x='20' y='152' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='152' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='172' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>出 12:13</tspan>  「我一見這血，就越過你們去」</text>
<rect x='20' y='190' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='190' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='210' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>出 12:46</tspan>  「羊羔的骨頭一根也不可折斷」</text>
<rect x='20' y='228' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='228' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='248' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>出 24:8</tspan>  「你看！這是立約的血」</text>
<rect x='20' y='266' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='266' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='286' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>利 16:22</tspan>  「這羊要擔當他們一切的罪孽」</text>
<rect x='20' y='304' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='304' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='324' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>利 17:11</tspan>  「因血裏有生命，所以能贖罪」</text>
<rect x='20' y='342' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='342' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='362' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>民 21:8</tspan>  「凡被咬的，一望這蛇，就必得活」</text>
<rect x='20' y='380' width='380' height='30' rx='4' fill='#d8f0e6'/>
<rect x='20' y='380' width='4' height='30' rx='2' fill='#1baf7a'/>
<text x='32' y='400' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>賽 53:5</tspan>  「因他受的鞭傷，我們得醫治」</text>
<rect x='20' y='418' width='380' height='30' rx='4' fill='#d8f0e6'/>
<rect x='20' y='418' width='4' height='30' rx='2' fill='#1baf7a'/>
<text x='32' y='438' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>賽 53:7</tspan>  「他像羊羔被牽到宰殺之地」</text>
<rect x='20' y='456' width='380' height='30' rx='4' fill='#d8f0e6'/>
<rect x='20' y='456' width='4' height='30' rx='2' fill='#1baf7a'/>
<text x='32' y='476' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>賽 53:12</tspan>  「他卻擔當多人的罪」</text>
<rect x='720' y='76' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='76' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='96' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>太 26:28</tspan>  「這是我立約的血，為多人流出來」</text>
<rect x='720' y='114' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='114' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='134' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>約 1:29</tspan>  「看哪，神的羔羊，除去」</text>
<rect x='720' y='152' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='152' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='172' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>約 3:14</tspan>  「人子也必照樣被舉起來」</text>
<rect x='720' y='190' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='190' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='210' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>約 19:36</tspan>  「他的骨頭一根也不可折斷」</text>
<rect x='720' y='228' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='228' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='248' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>徒 8:32</tspan>  「他像羊被牽到宰殺之地」</text>
<rect x='720' y='266' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='266' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='286' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>林前 5:7</tspan>  「逾越節的羔羊基督已經被殺獻祭了」</text>
<rect x='720' y='304' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='304' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='324' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>來 2:14</tspan>  「要藉着死敗壞那掌死權的」</text>
<rect x='720' y='342' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='342' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='362' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>來 9:22</tspan>  「若不流血，罪就不得赦免了」</text>
<rect x='720' y='380' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='380' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='400' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>來 9:26</tspan>  「把自己獻為祭，好除掉罪」</text>
<rect x='720' y='418' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='418' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='438' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>來 9:28</tspan>  「一次被獻，擔當了多人的罪」</text>
<rect x='720' y='456' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='456' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='476' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>彼前 2:24</tspan>  「親身擔當了我們的罪」</text>
<rect x='720' y='494' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='494' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='514' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>啟 5:12</tspan>  「曾被殺的羔羊是配得」</text>
<rect x='560' y='538' width='540' height='46' rx='6' fill='#a8c7ec'/>
<text x='830.0' y='558' text-anchor='middle' font-size='14' font-weight='700' fill='#0b0b0b'>約 19:30  「成了」</text>
<text x='830.0' y='576' text-anchor='middle' font-size='12' fill='#0b0b0b'>十字架上的一個字 one word from the cross: Τετέλεσται</text>
<line x1='20' y1='612' x2='48' y2='612' stroke='#3a7bd5' stroke-width='3'/><text x='54' y='616' font-size='12' fill='#0b0b0b'>預表 types: 影兒在基督裏成了實體 (Heb 10:1)</text>
<line x1='350' y1='612' x2='378' y2='612' stroke='#1baf7a' stroke-width='3'/><text x='384' y='616' font-size='12' fill='#0b0b0b'>預言 prophecies: 應許在基督裏應驗</text>
<text x='20' y='638' font-size='12' fill='#52514e'>希伯來書說：他「一次獻祭，便叫那得以成聖的人永遠完全」（來 10:14）。羔羊在新約：約 1:29, 36；徒 8:32；彼前 1:19；啟示錄 29 次。</text>
