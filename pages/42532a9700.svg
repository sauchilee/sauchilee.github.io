<text x='720' y='67' font-size='12' font-weight='700' fill='#0b0b0b'>新約 New Testament</text>
<rect x='20' y='76' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='76' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='96' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>出 3:14</tspan>  「我是自有永有的」</text>
<rect x='20' y='114' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='114' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='134' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>申 6:4</tspan>  「耶和華我們神是獨一的主」</text>
<rect x='20' y='152' width='380' height='30' rx='4' fill='#d8f0e6'/>
<rect x='20' y='152' width='4' height='30' rx='2' fill='#1baf7a'/>
<text x='32' y='172' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>詩 45:6</tspan>  「神阿，你的寶座是永永遠遠的」</text>
<rect x='20' y='190' width='380' height='30' rx='4' fill='#d8f0e6'/>
<rect x='20' y='190' width='4' height='30' rx='2' fill='#1baf7a'/>
<text x='32' y='210' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>詩 102:25</tspan>  「你起初立了地的根基」</text>
<rect x='20' y='228' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='228' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='248' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>賽 6:1</tspan>  「我見主坐在高高的寶座上」</text>
<rect x='20' y='266' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='266' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='286' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>賽 8:13</tspan>  「但要尊萬軍之耶和華為聖」</text>
<rect x='20' y='304' width='380' height='30' rx='4' fill='#d8f0e6'/>
<rect x='20' y='304' width='4' height='30' rx='2' fill='#1baf7a'/>
<text x='32' y='324' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>賽 40:3</tspan>  「在曠野預備耶和華的路」</text>
<rect x='20' y='342' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='342' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='362' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>賽 44:6</tspan>  「我是首先的，我是末後的」</text>
<rect x='20' y='380' width='380' height='30' rx='4' fill='#dde7f5'/>
<rect x='20' y='380' width='4' height='30' rx='2' fill='#3a7bd5'/>
<text x='32' y='400' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>賽 45:23</tspan>  「萬膝必向我跪拜」</text>
<rect x='20' y='418' width='380' height='30' rx='4' fill='#d8f0e6'/>
<rect x='20' y='418' width='4' height='30' rx='2' fill='#1baf7a'/>
<text x='32' y='438' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>珥 2:32</tspan>  「凡求告耶和華名的就必得救」</text>
<rect x='20' y='456' width='380' height='30' rx='4' fill='#d8f0e6'/>
<rect x='20' y='456' width='4' height='30' rx='2' fill='#1baf7a'/>
<text x='32' y='476' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>亞 12:10</tspan>  「他們必仰望我」</text>
<rect x='720' y='76' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='76' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='96' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>可 1:3</tspan>  「預備主的道」</text>
<rect x='720' y='114' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='114' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='134' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>約 8:58</tspan>  「還沒有亞伯拉罕就有了我」</text>
<rect x='720' y='152' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='152' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='172' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>約 12:41</tspan>  「以賽亞因為看見他的榮耀」</text>
<rect x='720' y='190' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='190' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='210' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>約 19:37</tspan>  「他們要仰望自己所扎的人」</text>
<rect x='720' y='228' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='228' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='248' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>羅 10:13</tspan>  「凡求告主名的，就必得救」</text>
<rect x='720' y='266' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='266' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='286' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>林前 8:6</tspan>  「並有一位主，就是耶穌基督」</text>
<rect x='720' y='304' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='304' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='324' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>腓 2:10</tspan>  「因耶穌的名無不屈膝」</text>
<rect x='720' y='342' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='342' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='362' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>來 1:8</tspan>  「論到子卻說：神啊，你的寶座」</text>
<rect x='720' y='380' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='380' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='400' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>來 1:10</tspan>  「主啊，你起初立了地的根基」</text>
<rect x='720' y='418' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='418' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='438' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>彼前 3:15</tspan>  「只要心裏尊主基督為聖」</text>
<rect x='720' y='456' width='380' height='30' rx='4' fill='#dfeaf6'/>
<rect x='1096' y='456' width='4' height='30' rx='2' fill='#2a78d6'/>
<text x='730' y='476' font-size='13' fill='#0b0b0b'><tspan font-weight='700'>啟 22:13</tspan>  「我是首先的，我是末後的」</text>
<rect x='560' y='500' width='540' height='46' rx='6' fill='#a8c7ec'/>
<text x='830.0' y='520' text-anchor='middle' font-size='14' font-weight='700' fill='#0b0b0b'>約 20:28  「我的主！我的神！」</text>
<text x='830.0' y='538' text-anchor='middle' font-size='12' fill='#0b0b0b'>多馬的認信 Thomas confesses: Ὁ Κύριός μου καὶ ὁ Θεός μου</text>
<line x1='20' y1='574' x2='48' y2='574' stroke='#1baf7a' stroke-width='3'/><text x='54' y='578' font-size='12' fill='#0b0b0b'>引用 quoted: 舊約的話直接用在耶穌身上</text>
<line x1='350' y1='574' x2='378' y2='574' stroke='#3a7bd5' stroke-width='3'/><text x='384' y='578' font-size='12' fill='#0b0b0b'>呼應 echoed: 只屬耶和華的名號與敬拜，歸給耶穌</text>
<text x='20' y='600' font-size='12' fill='#52514e'>「太初有道，道與神同在，道就是神」（約 1:1）。以賽亞書 40–48 章最清楚：只有耶和華是首先的、末後的，萬膝向他跪拜；新約把這些都說在耶穌身上。</text>
</svg>