<svg xmlns="http://www.w3.org/2000/svg" width="680" height="161" viewBox="0 0 680 161" role="img" aria-label="seraphim 撒拉弗 — by book">
<style>
.t{font:600 15px system-ui,-apple-system,'PingFang TC',sans-serif;fill:#0b0b0b}
.s{font:12px system-ui,-apple-system,'PingFang TC',sans-serif;fill:#52514e}
.l{font:13px system-ui,-apple-system,'PingFang TC',sans-serif;fill:#0b0b0b}
.v{font:12px system-ui,-apple-system,sans-serif;fill:#52514e;font-variant-numeric:tabular-nums}
.b{fill:#2a78d6}.g{stroke:#e1e0d9;stroke-width:1}.a{stroke:#c3c2b7;stroke-width:1}.bg{fill:#fcfcfb}
@media (prefers-color-scheme:dark){.t,.l{fill:#f0efec}.s,.v{fill:#c3c2b7}.b{fill:#3987e5}.g{stroke:#2c2c2a}.a{stroke:#383835}.bg{fill:#1a1a19}}
</style>
<rect class="bg" x="0" y="0" width="680" height="161" rx="8"/>
<text class="t" x="14" y="26">seraphim 撒拉弗 — by book</text>
<text class="s" x="14" y="62">Hebrew seraph, fiery serpent שָׂרָף: rate per 10,000 words, books where it stands (OT)</text>
<line class="a" x1="190" y1="72" x2="190" y2="129"/>
<text class="l" x="182" y="86.0" text-anchor="end">Num</text>
<rect class="b" x="190" y="74" width="197.7" height="15" rx="3"/>
<text class="v" x="393.7" y="85.5">0.9 (2)</text>
<text class="l" x="182" y="105.0" text-anchor="end">Deut</text>
<rect class="b" x="190" y="93" width="114.9" height="15" rx="3"/>
<text class="v" x="310.9" y="104.5">0.5 (1)</text>
<text class="l" x="182" y="124.0" text-anchor="end">Isa ★</text>
<rect class="b" x="190" y="112" width="400.0" height="15" rx="3"/>
<text class="v" x="596.0" y="123.5">1.7 (4)</text>
<text class="s" x="14" y="151">★ = significantly more than the book size predicts (log-likelihood, p &lt; 0.001). Number in brackets = count.</text>
</svg>
